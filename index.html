<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Accessibility Auditor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .audit-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="url"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .summary-card {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .summary-card.critical {
            background: #fee;
            border-left: 4px solid #dc3545;
        }

        .summary-card.serious {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }

        .summary-card.moderate {
            background: #e7f3ff;
            border-left: 4px solid #0dcaf0;
        }

        .summary-card.minor {
            background: #f0f0f0;
            border-left: 4px solid #6c757d;
        }

        .summary-card .count {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .summary-card .label {
            font-size: 0.9em;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .score-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            color: white;
        }

        .score {
            font-size: 4em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .score-label {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .issues-section {
            margin-top: 30px;
        }

        .issue-category {
            margin-bottom: 30px;
        }

        .category-header {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 8px 8px 0 0;
            border-left: 4px solid #667eea;
            font-weight: 600;
            font-size: 1.1em;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .category-header:hover {
            background: #e9ecef;
        }

        .issue-count-badge {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .issue-item {
            border: 1px solid #e1e8ed;
            border-top: none;
            padding: 20px;
            background: white;
        }

        .issue-item:last-child {
            border-radius: 0 0 8px 8px;
        }

        .issue-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
        }

        .severity-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .severity-badge.critical {
            background: #dc3545;
            color: white;
        }

        .severity-badge.serious {
            background: #ffc107;
            color: #000;
        }

        .severity-badge.moderate {
            background: #0dcaf0;
            color: #000;
        }

        .severity-badge.minor {
            background: #6c757d;
            color: white;
        }

        .issue-title {
            flex: 1;
            font-weight: 600;
            font-size: 1.05em;
            color: #333;
        }

        .issue-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .issue-details {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .issue-details h4 {
            color: #333;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .issue-details pre {
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 0.85em;
            border: 1px solid #e1e8ed;
        }

        .wcag-reference {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: #e7f3ff;
            border-radius: 4px;
            font-size: 0.85em;
            color: #0066cc;
            text-decoration: none;
            margin-bottom: 15px;
        }

        .solution-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            border-radius: 6px;
        }

        .solution-box h4 {
            color: #2e7d32;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .solution-box p {
            color: #333;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .code-example {
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #c8e6c9;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            overflow-x: auto;
        }

        .export-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            margin-top: 20px;
        }

        .export-btn:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .summary {
                grid-template-columns: 1fr 1fr;
            }
            
            .score {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 Web Accessibility Auditor</h1>
            <p>Comprehensive WCAG 2.1 Compliance Checker</p>
        </div>

        <div class="audit-card">
            <div class="input-section">
                <div class="input-group">
                    <label for="websiteUrl">Enter Website URL to Audit</label>
                    <input type="url" id="websiteUrl" placeholder="https://example.com" required>
                </div>
                <button class="btn" id="auditBtn" onclick="startAudit()">Start Accessibility Audit</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing website accessibility...</p>
                <p style="font-size: 0.9em; color: #666; margin-top: 10px;">This may take a few moments</p>
            </div>

            <div class="results" id="results">
                <div class="score-section">
                    <div class="score" id="accessibilityScore">0</div>
                    <div class="score-label">Accessibility Score</div>
                </div>

                <div class="summary" id="summary"></div>

                <div class="issues-section" id="issuesSection"></div>

                <button class="btn export-btn" onclick="exportReport()">📄 Export Detailed Report</button>
            </div>
        </div>
    </div>

    <script>
        let auditData = null;

        async function startAudit() {
            const urlInput = document.getElementById('websiteUrl');
            const url = urlInput.value.trim();

            if (!url) {
                alert('Please enter a valid URL');
                return;
            }

            // Validate URL format
            try {
                new URL(url);
            } catch (e) {
                alert('Please enter a valid URL (e.g., https://example.com)');
                return;
            }

            // Show loading, hide results
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            document.getElementById('auditBtn').disabled = true;

            // Simulate audit (in real implementation, this would call an API or run actual checks)
            setTimeout(() => {
                performAudit(url);
            }, 2000);
        }

        function performAudit(url) {
            // This is a comprehensive simulation. In production, you would:
            // 1. Fetch the actual webpage
            // 2. Parse the HTML/DOM
            // 3. Run automated accessibility tests (axe-core, pa11y, etc.)
            // 4. Check WCAG 2.1 compliance

            auditData = {
                url: url,
                timestamp: new Date().toISOString(),
                score: 68,
                issues: generateComprehensiveIssues()
            };

            displayResults();
        }

        function generateComprehensiveIssues() {
            return [
                {
                    category: 'Images & Alternative Text',
                    issues: [
                        {
                            severity: 'critical',
                            title: 'Images missing alternative text',
                            description: 'Found 12 images without alt attributes. Screen readers cannot describe these images to visually impaired users.',
                            wcag: 'WCAG 2.1 Level A - 1.1.1 Non-text Content',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/non-text-content.html',
                            element: '<img src="/banner.jpg">',
                            location: 'Header section, line 45',
                            solution: 'Add meaningful alt text to all images. For decorative images, use empty alt attribute (alt="").',
                            codeExample: '<img src="/banner.jpg" alt="Company logo showing a blue mountain">'
                        },
                        {
                            severity: 'moderate',
                            title: 'Redundant alternative text',
                            description: '3 images have alt text that contains "image of" or "picture of", which is redundant for screen readers.',
                            wcag: 'WCAG 2.1 Level A - 1.1.1 Non-text Content',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/non-text-content.html',
                            element: '<img src="/team.jpg" alt="Image of our team">',
                            location: 'About page, line 102',
                            solution: 'Remove redundant words like "image of" or "picture of" from alt text. Just describe the content.',
                            codeExample: '<img src="/team.jpg" alt="Our team celebrating in the office">'
                        }
                    ]
                },
                {
                    category: 'Keyboard Navigation',
                    issues: [
                        {
                            severity: 'critical',
                            title: 'Interactive elements not keyboard accessible',
                            description: 'Custom dropdown menu cannot be operated with keyboard. Users who cannot use a mouse will be unable to navigate.',
                            wcag: 'WCAG 2.1 Level A - 2.1.1 Keyboard',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/keyboard.html',
                            element: '<div class="dropdown" onclick="toggleMenu()">',
                            location: 'Navigation bar, line 23',
                            solution: 'Make the dropdown keyboard accessible by using button element with proper ARIA attributes and keyboard event handlers.',
                            codeExample: '<button class="dropdown" aria-expanded="false" aria-haspopup="true" onclick="toggleMenu()" onkeydown="handleKeyDown(event)">\n  Menu\n</button>'
                        },
                        {
                            severity: 'serious',
                            title: 'Missing skip navigation link',
                            description: 'No "skip to main content" link found. Keyboard users must tab through all navigation links to reach main content.',
                            wcag: 'WCAG 2.1 Level A - 2.4.1 Bypass Blocks',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/bypass-blocks.html',
                            element: 'N/A - Missing element',
                            location: 'Beginning of body tag',
                            solution: 'Add a skip link as the first focusable element on the page.',
                            codeExample: '<a href="#main-content" class="skip-link">Skip to main content</a>\n<style>\n  .skip-link {\n    position: absolute;\n    top: -40px;\n  }\n  .skip-link:focus {\n    top: 0;\n  }\n</style>'
                        }
                    ]
                },
                {
                    category: 'Color & Contrast',
                    issues: [
                        {
                            severity: 'serious',
                            title: 'Insufficient color contrast',
                            description: 'Text with color #777 on white background has contrast ratio of 3.8:1. WCAG AA requires 4.5:1 for normal text.',
                            wcag: 'WCAG 2.1 Level AA - 1.4.3 Contrast (Minimum)',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/contrast-minimum.html',
                            element: '<p style="color: #777;">Important information</p>',
                            location: 'Main content, multiple locations',
                            solution: 'Use darker text color to meet contrast requirements. Change #777 to #595959 or darker.',
                            codeExample: '<p style="color: #595959;">Important information</p>\n<!-- Contrast ratio: 7:1 (WCAG AAA compliant) -->'
                        },
                        {
                            severity: 'serious',
                            title: 'Information conveyed by color alone',
                            description: 'Required form fields indicated only by red color. Colorblind users may not identify required fields.',
                            wcag: 'WCAG 2.1 Level A - 1.4.1 Use of Color',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/use-of-color.html',
                            element: '<label style="color: red;">Name</label>',
                            location: 'Contact form, line 234',
                            solution: 'Add text or symbols in addition to color to indicate required fields.',
                            codeExample: '<label>Name <span aria-label="required">*</span></label>\n<!-- Or use aria-required on the input -->\n<input type="text" aria-required="true">'
                        }
                    ]
                },
                {
                    category: 'Forms & Labels',
                    issues: [
                        {
                            severity: 'critical',
                            title: 'Form inputs without associated labels',
                            description: 'Found 8 input fields without proper label elements. Screen reader users cannot determine what information to enter.',
                            wcag: 'WCAG 2.1 Level A - 1.3.1 Info and Relationships',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/info-and-relationships.html',
                            element: '<input type="text" placeholder="Enter email">',
                            location: 'Newsletter signup, line 456',
                            solution: 'Always associate labels with form inputs using the "for" attribute or by wrapping the input.',
                            codeExample: '<label for="email">Email Address</label>\n<input type="email" id="email" name="email">\n\n<!-- Or wrapped -->\n<label>\n  Email Address\n  <input type="email" name="email">\n</label>'
                        },
                        {
                            severity: 'serious',
                            title: 'Missing error identification',
                            description: 'Form errors not clearly identified. Error messages appear only in visual styling without proper ARIA attributes.',
                            wcag: 'WCAG 2.1 Level A - 3.3.1 Error Identification',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/error-identification.html',
                            element: '<div class="error">Invalid email</div>',
                            location: 'Contact form validation',
                            solution: 'Use aria-describedby to associate error messages with inputs and aria-invalid to mark invalid fields.',
                            codeExample: '<label for="email">Email</label>\n<input type="email" id="email" aria-invalid="true" aria-describedby="email-error">\n<div id="email-error" role="alert">Please enter a valid email address</div>'
                        }
                    ]
                },
                {
                    category: 'Headings & Structure',
                    issues: [
                        {
                            severity: 'serious',
                            title: 'Skipped heading levels',
                            description: 'Page jumps from h2 to h4, skipping h3. This breaks the logical document structure for screen reader users.',
                            wcag: 'WCAG 2.1 Level A - 1.3.1 Info and Relationships',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/info-and-relationships.html',
                            element: '<h2>Section</h2>...<h4>Subsection</h4>',
                            location: 'Main content, line 289',
                            solution: 'Use heading levels sequentially without skipping. Change h4 to h3.',
                            codeExample: '<h2>Main Section</h2>\n<h3>Subsection</h3>\n<h4>Sub-subsection</h4>'
                        },
                        {
                            severity: 'moderate',
                            title: 'Multiple h1 headings',
                            description: 'Page contains 3 h1 headings. Best practice is to have only one h1 per page for clear document hierarchy.',
                            wcag: 'WCAG 2.1 Level A - 1.3.1 Info and Relationships',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/info-and-relationships.html',
                            element: '<h1>Welcome</h1>...<h1>About Us</h1>...<h1>Contact</h1>',
                            location: 'Multiple sections',
                            solution: 'Use only one h1 for the main page title. Convert others to h2 or appropriate levels.',
                            codeExample: '<h1>Welcome to Our Website</h1>\n<h2>About Us</h2>\n<h2>Contact</h2>'
                        }
                    ]
                },
                {
                    category: 'ARIA & Semantic HTML',
                    issues: [
                        {
                            severity: 'serious',
                            title: 'Missing ARIA landmarks',
                            description: 'Page lacks proper landmark regions (main, nav, header, footer). Screen reader users cannot quickly navigate between page sections.',
                            wcag: 'WCAG 2.1 Level A - 1.3.1 Info and Relationships',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/info-and-relationships.html',
                            element: '<div class="content">...</div>',
                            location: 'Page structure',
                            solution: 'Use semantic HTML5 elements or ARIA roles to define page landmarks.',
                            codeExample: '<header role="banner">\n  <nav role="navigation">...</nav>\n</header>\n<main role="main">...</main>\n<footer role="contentinfo">...</footer>'
                        },
                        {
                            severity: 'moderate',
                            title: 'Buttons using div elements',
                            description: 'Found 5 clickable div elements that should be buttons. These lack proper keyboard support and semantics.',
                            wcag: 'WCAG 2.1 Level A - 4.1.2 Name, Role, Value',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/name-role-value.html',
                            element: '<div class="btn" onclick="submit()">Submit</div>',
                            location: 'Forms and CTAs',
                            solution: 'Use proper button elements instead of div elements for interactive controls.',
                            codeExample: '<button type="submit">Submit</button>\n<!-- Or if you must use div: -->\n<div role="button" tabindex="0" onclick="submit()" onkeypress="handleKeyPress(event)">Submit</div>'
                        }
                    ]
                },
                {
                    category: 'Links & Navigation',
                    issues: [
                        {
                            severity: 'moderate',
                            title: 'Ambiguous link text',
                            description: 'Multiple links with text "Click here" or "Read more". Screen reader users cannot understand link purpose out of context.',
                            wcag: 'WCAG 2.1 Level A - 2.4.4 Link Purpose (In Context)',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/link-purpose-in-context.html',
                            element: '<a href="/article1">Click here</a>',
                            location: 'Blog section, multiple locations',
                            solution: 'Use descriptive link text that makes sense out of context, or add aria-label with description.',
                            codeExample: '<a href="/article1">Read our guide to web accessibility</a>\n<!-- Or -->\n<a href="/article1" aria-label="Read more about web accessibility best practices">Read more</a>'
                        },
                        {
                            severity: 'minor',
                            title: 'Links opening in new window without warning',
                            description: '7 external links open in new windows/tabs without informing users. This can be disorienting.',
                            wcag: 'WCAG 2.1 Level AAA - 3.2.5 Change on Request',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/change-on-request.html',
                            element: '<a href="external.com" target="_blank">External site</a>',
                            location: 'Resource links',
                            solution: 'Inform users when links open in new windows using text or ARIA labels.',
                            codeExample: '<a href="external.com" target="_blank" rel="noopener">\n  External site\n  <span aria-label="(opens in new window)"> ↗</span>\n</a>'
                        }
                    ]
                },
                {
                    category: 'Multimedia & Audio',
                    issues: [
                        {
                            severity: 'critical',
                            title: 'Video without captions',
                            description: 'Embedded video lacks closed captions. Deaf and hard-of-hearing users cannot access the content.',
                            wcag: 'WCAG 2.1 Level A - 1.2.2 Captions (Prerecorded)',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/captions-prerecorded.html',
                            element: '<video src="/promo.mp4"></video>',
                            location: 'Homepage video section',
                            solution: 'Add WebVTT caption file to video element using the track element.',
                            codeExample: '<video src="/promo.mp4" controls>\n  <track kind="captions" src="/captions-en.vtt" srclang="en" label="English">\n  <track kind="captions" src="/captions-es.vtt" srclang="es" label="Spanish">\n</video>'
                        },
                        {
                            severity: 'serious',
                            title: 'Auto-playing audio',
                            description: 'Background music starts automatically without user control. This is disruptive for screen reader users.',
                            wcag: 'WCAG 2.1 Level A - 1.4.2 Audio Control',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/audio-control.html',
                            element: '<audio src="/bg-music.mp3" autoplay loop>',
                            location: 'Page background',
                            solution: 'Remove autoplay attribute and provide visible controls for users to start/stop audio.',
                            codeExample: '<audio src="/bg-music.mp3" controls>\n  Your browser does not support the audio element.\n</audio>\n<!-- Or add a toggle button -->\n<button onclick="toggleAudio()">Play Background Music</button>'
                        }
                    ]
                },
                {
                    category: 'Language & Readability',
                    issues: [
                        {
                            severity: 'moderate',
                            title: 'Missing language attribute',
                            description: 'HTML element lacks lang attribute. Screen readers cannot determine the correct pronunciation and language.',
                            wcag: 'WCAG 2.1 Level A - 3.1.1 Language of Page',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/language-of-page.html',
                            element: '<html>',
                            location: 'Document root',
                            solution: 'Add lang attribute to the html element specifying the page\'s primary language.',
                            codeExample: '<html lang="en">\n<!-- For other languages:\n  lang="es" (Spanish)\n  lang="fr" (French)\n  lang="de" (German)\n-->'
                        }
                    ]
                },
                {
                    category: 'Mobile & Responsive',
                    issues: [
                        {
                            severity: 'serious',
                            title: 'Touch targets too small',
                            description: 'Several interactive elements are smaller than 44x44 pixels. Users with motor impairments may have difficulty tapping them.',
                            wcag: 'WCAG 2.1 Level AAA - 2.5.5 Target Size',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/target-size.html',
                            element: '<button class="icon-btn">×</button>',
                            location: 'Modal close buttons',
                            solution: 'Ensure all touch targets are at least 44x44 pixels in size, or have adequate spacing.',
                            codeExample: '<button class="icon-btn" style="min-width: 44px; min-height: 44px; padding: 12px;">×</button>'
                        },
                        {
                            severity: 'moderate',
                            title: 'Viewport not properly configured',
                            description: 'Missing or improper viewport meta tag. Page may not scale correctly on mobile devices.',
                            wcag: 'WCAG 2.1 Level AA - 1.4.10 Reflow',
                            wcagUrl: 'https://www.w3.org/WAI/WCAG21/Understanding/reflow.html',
                            element: 'Missing meta tag',
                            location: 'Document head',
                            solution: 'Add proper viewport meta tag to enable responsive design.',
                            codeExample: '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
                        }
                    ]
                }
            ];
        }

        function displayResults() {
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');
            
            loadingDiv.classList.remove('active');
            resultsDiv.classList.add('active');
            document.getElementById('auditBtn').disabled = false;

            // Display score
            document.getElementById('accessibilityScore').textContent = auditData.score;

            // Calculate summary
            const summary = {
                critical: 0,
                serious: 0,
                moderate: 0,
                minor: 0
            };

            auditData.issues.forEach(category => {
                category.issues.forEach(issue => {
                    summary[issue.severity]++;
                });
            });

            // Display summary
            const summaryDiv = document.getElementById('summary');
            summaryDiv.innerHTML = `
                <div class="summary-card critical">
                    <div class="count">${summary.critical}</div>
                    <div class="label">Critical</div>
                </div>
                <div class="summary-card serious">
                    <div class="count">${summary.serious}</div>
                    <div class="label">Serious</div>
                </div>
                <div class="summary-card moderate">
                    <div class="count">${summary.moderate}</div>
                    <div class="label">Moderate</div>
                </div>
                <div class="summary-card minor">
                    <div class="count">${summary.minor}</div>
                    <div class="label">Minor</div>
                </div>
            `;

            // Display issues
            const issuesSection = document.getElementById('issuesSection');
            issuesSection.innerHTML = '<h2 style="margin-bottom: 20px; color: #333;">Detailed Issues & Solutions</h2>';

            auditData.issues.forEach((category, catIndex) => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'issue-category';
                categoryDiv.innerHTML = `
                    <div class="category-header" onclick="toggleCategory(${catIndex})">
                        <span>${category.category}</span>
                        <span class="issue-count-badge">${category.issues.length} issue${category.issues.length !== 1 ? 's' : ''}</span>
                    </div>
                    <div id="category-${catIndex}" class="category-content">
                        ${category.issues.map((issue, issueIndex) => `
                            <div class="issue-item">
                                <div class="issue-header">
                                    <span class="severity-badge ${issue.severity}">${issue.severity}</span>
                                    <div class="issue-title">${issue.title}</div>
                                </div>
                                <div class="issue-description">${issue.description}</div>
                                <a href="${issue.wcagUrl}" target="_blank" class="wcag-reference">
                                    📋 ${issue.wcag}
                                </a>
                                <div class="issue-details">
                                    <h4>📍 Problem Element:</h4>
                                    <pre>${escapeHtml(issue.element)}</pre>
                                    <p style="margin-top: 10px; color: #666; font-size: 0.9em;"><strong>Location:</strong> ${issue.location}</p>
                                </div>
                                <div class="solution-box">
                                    <h4>✅ Solution:</h4>
                                    <p>${issue.solution}</p>
                                    <h4 style="margin-top: 10px;">💻 Code Example:</h4>
                                    <div class="code-example">${escapeHtml(issue.codeExample)}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                issuesSection.appendChild(categoryDiv);
            });
        }

        function toggleCategory(index) {
            const content = document.getElementById(`category-${index}`);
            if (content.style.display === 'none') {
                content.style.display = 'block';
            } else {
                content.style.display = 'none';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function exportReport() {
            if (!auditData) return;

            const report = generateTextReport();
            const blob = new Blob([report], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `accessibility-audit-${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function generateTextReport() {
            let report = `
WEB ACCESSIBILITY AUDIT REPORT
===============================

URL: ${auditData.url}
Date: ${new Date(auditData.timestamp).toLocaleString()}
Accessibility Score: ${auditData.score}/100

SUMMARY
-------
`;
            const summary = {
                critical: 0,
                serious: 0,
                moderate: 0,
                minor: 0
            };

            auditData.issues.forEach(category => {
                category.issues.forEach(issue => {
                    summary[issue.severity]++;
                });
            });

            report += `Critical Issues: ${summary.critical}\n`;
            report += `Serious Issues: ${summary.serious}\n`;
            report += `Moderate Issues: ${summary.moderate}\n`;
            report += `Minor Issues: ${summary.minor}\n`;
            report += `Total Issues: ${summary.critical + summary.serious + summary.moderate + summary.minor}\n\n`;

            report += `DETAILED ISSUES\n`;
            report += `===============\n\n`;

            auditData.issues.forEach(category => {
                report += `\n${category.category.toUpperCase()}\n`;
                report += `${'='.repeat(category.category.length)}\n\n`;

                category.issues.forEach((issue, index) => {
                    report += `${index + 1}. ${issue.title}\n`;
                    report += `   Severity: ${issue.severity.toUpperCase()}\n`;
                    report += `   WCAG: ${issue.wcag}\n`;
                    report += `   Reference: ${issue.wcagUrl}\n\n`;
                    report += `   Description:\n   ${issue.description}\n\n`;
                    report += `   Problem Element:\n   ${issue.element}\n`;
                    report += `   Location: ${issue.location}\n\n`;
                    report += `   Solution:\n   ${issue.solution}\n\n`;
                    report += `   Code Example:\n   ${issue.codeExample}\n\n`;
                    report += `   ${'-'.repeat(80)}\n\n`;
                });
            });

            return report;
        }
    </script>
</body>
</html>
